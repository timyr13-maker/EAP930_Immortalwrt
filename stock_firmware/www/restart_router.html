<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title></title>
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=yes, viewport-fit=cover">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
		<meta http-equiv="Expires" content="0">
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
		<meta name="renderer" content="webkit|ie-comp|ie-stand">
		<meta name="format-detection" content="telephone=no"/>
		<link rel="stylesheet" href="css/bootstrap.min.css" />
		<script type="text/javascript" src="js/publicPlugin/app.js"></script>
		<script type="text/javascript">
			removeDir();
			setPath("index");
		</script>	
		<script type="text/javascript">
			document.write("<link rel='stylesheet' type='text/css' href='css/public.css" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.write("<link rel='shortcut icon' type='image/x-icon' href='favicon.ico" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.close();
		</script>
		<script type="text/javascript" src="js/publicPlugin/jquery.min.js"></script>	
		<script type="text/javascript" src="js/publicPlugin/bootstrap.min.js"></script>
		<script type="text/javascript"> 
			document.write('<script src="js/publicPlugin/dLoad.js' + (isApp().isRemote ? "" : '?_=' + new Date().getTime()) + '"><\/script>');
			document.close();
		</script>	
		<style>
				#reset-tip-box {
				margin: 20px auto 40px;
				text-align: center;
			}
			
			
			@media (max-width: 450px) {
				.text-center img { max-width:65%; }
			}
			
		.btn-sec { margin-top:35px; }
		</style>
	</head>
	<body>
		<div class="g-wrapper">
			 <!--头部公用-->   
			<div id="header"></div>
		    <!--内容-->
		    <div class="totalShell_content">
		    	<div class="f-locationH3-container">
		    	</div>
		    	<div class="f-content-container">
		    	<div class="container-fluid">
					<div class="row">
						<div class="col-sm-12 col-md-8 col-md-offset-2">
							<div class="d-cnt">
							<div class="f-shell">
								<div class="container-fluid">
									<div class="row">
										<div class="form-sec ">	
											<div class="infoone">
												
											
											<div id="reset-tip-box">
												<div class="note-box">
													<div class="wrapper">
														<i class="warning icon"></i>
														<span class="tip-sec"></span>
													</div>
												</div>
											</div>
											
											<form id="reset_frm" name="reset_frm" onSubmit="return false">
												<div class="text-center">
													<img src="./images/lq9.png" />
												</div>
												<div class="btn-sec form-group clearfix">
													<div class="text-center">
														<button type="button" class="btn btn-bigger btn-restart" data-toggle="modal" onClick="reset_confirm();"></button>
													</div>
												</div>
											</form>
											</div>
										</div>
										<div class="infoone hidden">
											<div class="countdown-sec">
												<img width="120" src="./images/turn.gif" />
												<div id="time">75</div>
											</div>	
											<p class="countdown-tip" id="reset_tip"></p>
										</div>
									</div>
								</div>														
							</div>
						</div>
					</div>
				</div>
		    	</div>
		    	</div>	 
		    </div>
		</div>
		
    	
    	
    	<div class="modal fade" id="resetModal" tabindex="-1">
		  <div class="modal-dialog">
			<div class="modal-content">
			  <div class="modal-header">
				<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
				<h4 class="modal-title"></h4>
			  </div>
			  <div class="modal-body">
			  </div>
			  <div class="modal-footer">
				<button type="button" class="dialog-btn btn-cancel" data-dismiss="modal"></button>
				<button type="button" class="dialog-btn btn-confirm"></button>
			  </div>
			</div>
		  </div>
		</div>
    	<!--一个遮罩，重启成功后就显示让用户禁止点击-->
    	<div class="fullScreenMask hidden"></div>
    	
    	
    	<div id="lock_div"></div>
		<div id="message_layer">
		    <div id="msg_type" class="wait"></div>
		    <div id="msg" class="word"></div>
		</div>
		<script type="text/javascript">
			loadJsQueue(["restart_router"]);
			
		</script>
	</body>
</html>
