<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title></title>
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=yes, viewport-fit=cover">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
		<meta http-equiv="Expires" content="0">
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
		<meta name="renderer" content="webkit|ie-comp|ie-stand">
		<meta name="format-detection" content="telephone=no"/>
		<link rel="stylesheet" href="css/bootstrap.min.css" />
		<script type="text/javascript" src="js/publicPlugin/app.js"></script>
		<script type="text/javascript">
			document.write("<link rel='stylesheet' type='text/css' href='css/public.css" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.write("<link rel='shortcut icon' type='image/x-icon' href='favicon.ico" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.close();
		</script>
		<script type="text/javascript" src="js/publicPlugin/jquery.min.js"></script>	
		<script type="text/javascript" src="js/publicPlugin/bootstrap.min.js"></script>
		<script type="text/javascript"> 
			document.write('<script src="js/publicPlugin/dLoad.js' + (isApp().isRemote ? "" : '?_=' + new Date().getTime()) + '"><\/script>');
			document.close();
		</script>
		<style type="text/css">
		.card {
					/*border:1px solid #e3e6f0;*/
					border-radius:4px;
					width:95%;
					max-width:1000px;
					margin:0 auto;
					margin-bottom:30px;
				}
				.card:first-child{
					margin-top:45px;
				}
				@media (max-width: 1100px) {
					.card{
						width:100%;
					}
					.card:first-child{
						margin-top:0;
					}
				}
				
				
				.card-cnt{
					font-size:16px;
					padding:20px 0 20px;
				}
				.card-cnt ul {
					width:85%;
					margin:0 auto;
				}
				
				
				.card-cnt li{
					    padding: 10px 0;
					    line-height: 21px;
					    position: relative;
					    font-size: 14px;
				}
				.card-cnt li span{
					float:left;
					white-space:pre-line;
					display: inline-block;
					width: 50%;
				}
				.card-cnt li:after{
					content: "";
					display: block;
					height: 0;
					clear:both;
					visibility: hidden;
				}
				.card-cnt li span:first-child{
				
					/*width:23%;*/
					/*width: 30%;*/
		   			text-align: right;
				}
				
				.card-cnt .sep {
					height:1px;
					border-bottom:1px solid #e7eaf3;
					clear:both; 
					margin:0px auto 20px;
					padding-bottom:20px;
				}
				@media (max-width: 1100px) {
					.card-cnt li span:first-child{
						width:55%;
						text-align:left;
						float:left;
						word-break:break-all;
						
						
					}
					.card-cnt li span:last-child{
						width:45%;
						float:left;
						zoom:1;
						overflow:hidden;
						text-align: right;
					}
					
					.card-cnt li span{
						float:right;
						text-align:left;
						color:var(--light-gray);
						word-break:break-all;
					}
					
				}
				@media (max-width:768px) {
					.card-cnt ul {
					margin:0 4%;
					width:92%;
				}
			}
		</style>
	</head>
	<body>
		<div class="g-wrapper">
			<!--头部公用-->   
			<div id="header"></div>
			<!--内容-->
		    <div class="totalShell_content">
		    	<div class="f-locationH3-container">
				</div>
				<div class="f-content-container">
				<div class="container-fluid">
					<div class="row">
						<div class="col-sm-12 col-md-8 col-md-offset-2">
							<div class="d-cnt">
							<div class="f-shell">
								<div class="container-fluid form-sec">
									<div class="row">			
										<div class="marginTop30">
											<div class="card">
												<h3 class="card-header"></h3>
												<div class="card-cnt clearfix">
													
															<ul>
																<li>
																	<span class="txt"></span>
																	<span id="router_name"></span>
																</li>
																<li>
																	<span class="txt"></span>
																	<span id="wireless_rate"></span>
																</li>
														
																
																<li>
																	<span class="txt"></span>
																	<span id="flash"></span>
																</li>
															</ul>
													
												</div>
											</div>
											
											
											<div class="card" id="ipv4_information">
												<h3 class="card-header"></h3>
												<div class="card-cnt clearfix">
													
															<ul>
																<li class="ipv4_text">
																	<span class="txt"></span>
																	<span id="online_info_ipv4" style="text-transform: uppercase;"></span>
																</li>
															
																<li class="ipv4_text">
																	<span class="txt"></span>
																	<span id="routerInfo_wanIp"></span>
																</li>
																
																<!--<li class="ipv4_text">
																	<span class="txt"></span>
																	<span id="routerInfo_wanMac"></span>
																</li>-->
																<li class="ipv6_text">
																	<span class="txt_ipv6"></span>
																	<span id="online_info_ipv6" style="text-transform: uppercase;"></span>
																</li>
																<li class="ipv6_text">
																	<span class="txt_ipv6"></span>
																	<span id="routerInfo_wanIp_ipv6"></span>
																</li>
																<li class="ipv6_text">
																	<span class="txt_ipv6"></span>
																	<span id="routerInfo_prefix_ipv6"></span>
																</li>
															
																<li class="ipv4_text">
																	<span class="txt"></span>
																	<span id="routerInfo_dns_a"></span>
																</li>
																<li class="ipv4_text" id="ipv4_side_dns">
																	<span class="txt"></span>
																	<span id="routerInfo_dns_b"></span>
																</li>
																
																<li id="routerInfo_mac">
																	<span class="txt_ipv6"></span>
																	<span id="routerInfo_mac_a_ipv6"></span>
																</li>
																<li class="ipv6_text">
																	<span class="txt_ipv6"></span>
																	<span id="routerInfo_ipv6dns_a"></span>
																</li>
																<li class="ipv6_text" id="ipv6_side_dns">
																	<span class="txt_ipv6"></span>
																	<span id="routerInfo_ipv6dns_b"></span>
																</li>
															</ul>
													
												</div>
											</div>
											
											
											
											<div class="card">
												<h3 class="card-header"></h3>
												<div class="card-cnt clearfix ">
													
															<ul>
																<li class="item_wrap_text2">
																	<span class="txt"></span>
																	<span id="routerInfo_lanIp"></span>
																</li>
																<li class="item_wrap_text2">
																	<span class="txt"></span>
																	<span id="routerInfo_mask"></span>
																</li>
																
																<li class="item_wrap_text2 ipv6_text">
																	<span class="txt"></span>
																	<span id="routerInfo_lanIp_ipv6"></span>
																</li>
														
																
																<li class="hidden">
																	<span class="txt"></span>
																	<span id="routerInfo_dhcp_state"></span>
																</li>
																<li class="hidden">
																	<span class="txt"></span>
																	<span id="routerInfo_lanMac"></span>
																</li>
																<li>
																	<span class="txt"></span>
																	<span id="routerInfo_Mac_lan"></span>
																</li>
															</ul>
													
												</div>
											</div>
										</div>
									</div>
								</div>														
							</div>
							</div>
						</div>
					</div>
				</div>
		    </div>
		</div>
				</div>	 
		<div id="lock_div"></div>
		<div id="message_layer">
		    <div id="msg_type" class="wait"></div>
		    <div id="msg" class="word"></div>
		</div>
		
		<script type="text/javascript">
			loadJsQueue(["router_info"]);
			
			
		</script>
	</body>
</html>
