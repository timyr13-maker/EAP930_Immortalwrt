<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title></title>
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=yes, viewport-fit=cover">
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=yes, viewport-fit=cover">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
		<meta http-equiv="Expires" content="0">
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
		<meta name="renderer" content="webkit|ie-comp|ie-stand">
		<meta name="format-detection" content="telephone=no"/>
		<link rel="stylesheet" href="css/bootstrap.min.css" />
		<script type="text/javascript" src="js/publicPlugin/app.js"></script>
		<script type="text/javascript">
			document.write("<link rel='stylesheet' type='text/css' href='css/public.css" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.write("<link rel='shortcut icon' type='image/x-icon' href='favicon.ico" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.close();
		</script>
		<script type="text/javascript" src="js/publicPlugin/jquery.min.js"></script>	
		<script type="text/javascript" src="js/publicPlugin/bootstrap.min.js"></script>
		<script type="text/javascript"> 
			document.write('<script src="js/publicPlugin/dLoad.js' + (isApp().isRemote ? "" : '?_=' + new Date().getTime()) + '"><\/script>');
			document.close();
		</script>
		
		<style type="text/css">

		</style>
		
	</head>
	<body>
		<div class="g-wrapper">
			 <!--头部公用-->   
			<div id="header"></div>
		    <!--内容-->
			<div class="totalShell_content">
				<div class="f-locationH3-container">
				</div>
				<div class="f-content-container">
				<div class="container-fluid">
					<div class="row">
						<div class="col-sm-12 col-md-8 col-md-offset-2">
							<div class="d-cnt">
							<div class="f-shell">
								<div class="container-fluid form-sec">
									<div class="row">
										<div class="form-sec">
											<form id="time_setting_frm" class="marginTop20" name="time_setting_frm" method="post" action="javascript:void(0);"><!--form表单在此-->	
												<div class="form-group clearfix">
													<label class="col-xs-6 col-sm-4 col-md-4 col-lg-4 f-label"></label>
													<div class="col-xs-6 col-sm-8 col-md-8 col-lg-8 f-control">
														<span id="current_time"></span>
													</div>
												</div>
												
												<div class="form-group clearfix">
													<label class="col-xs-6 col-sm-4 col-md-4 col-lg-4 f-label"></label>
													<div class="col-xs-6 ccol-sm-8 col-md-8 col-lg-8 f-control">
	
														<div class="radio radio-info radio-inline">
															<input type="radio" id="inlineRadio1" class="radio_all" value="1" name="get_time_mode0" onClick="change_get_time_mode(this.value);" />
															<label for="inlineRadio1" class="radio-txt"></label>
														</div>
														
														<div class="radio radio-info radio-inline">
															<input type="radio" id="inlineRadio2" class="radio_all" value="0" name="get_time_mode0" onClick="change_get_time_mode(this.value);" />
															<label for="inlineRadio2" class="radio-txt"></label>
														</div>
														
													</div>
												</div>
												
												<!--NTP-->
												<div class="ntp_div">
												
												
													<div class="form-group clearfix">
														<label class="col-xs-6 col-sm-4 col-md-4 col-lg-4 f-label"></label>
														<div class="col-xs-6 col-sm-8 col-md-8 col-lg-8 f-control coverSelect">
															<select class="allChange" id="time_zone_sel"></select>
														</div>
													</div>
												
													<div class="form-group clearfix">
														<label class="col-xs-6 col-sm-4 col-md-4 col-lg-4 f-label"></label>
														<div class="col-xs-6 col-sm-8 col-md-8 col-lg-8 f-control">
															<table id="ntp_server_list" class="table table-striped editableTable"> 
															  <thead>
																<tr>
																
																  <th class="text-center domain_name_txt"></th>
																</tr>
															  </thead>
															  <tbody id="editableTable">
															  </tbody>											  
											
															</table>
														</div>
													</div>
												
												</div>
												<!--NTP END-->
												
												
												<!--手动配置-->
												<div class="manual_set_div hidden">
			
													<div class="form-group clearfix">
														<label class="col-xs-6 col-sm-4 col-md-4 col-lg-4 f-label"></label>
														<div class="col-xs-6 col-sm-8 col-md-8 col-lg-8 f-control">
															<input type="text" size="5" maxlength="4" name="year" id="system_year" onKeyUp="value=value.replace(/\D/g,'')" class="form-control form-control-small" />
															<label for="system_year" class="f-lbl-text"></label>
															<input type="text" size="5" maxlength="2" name="month" id="system_month" onKeyUp="value=value.replace(/\D/g,'')" class="form-control form-control-small" />
															<label for="system_month" class="f-lbl-text"></label>
															<input type="text" size="5" maxlength="2" name="day" id="system_day" onKeyUp="value=value.replace(/\D/g,'')" class="form-control form-control-small" />
															<label for="system_day" class="f-lbl-text"></label>
														</div>
													</div>
													
													
													<div class="form-group clearfix">
														<label class="col-xs-6 col-sm-4 col-md-4 col-lg-4 f-label"></label>
														<div class="col-xs-6 col-sm-8 col-md-8 col-lg-8 f-control">
															<input type="text" size="5" maxlength="4" name="hour" id="system_hour" onKeyUp="value=value.replace(/\D/g,'')" class="form-control form-control-small" />
															<label for="system_hour" class="f-lbl-text"></label>
															<input type="text" size="5" maxlength="2" name="minute" id="system_minute" onKeyUp="value=value.replace(/\D/g,'')" class="form-control form-control-small" />
															<label for="system_minute" class="f-lbl-text"></label>
															<input type="text" size="5" maxlength="2" name="second" id="system_second" onKeyUp="value=value.replace(/\D/g,'')" class="form-control form-control-small" />
															<label for="system_second" class="f-lbl-text"></label>
														</div>
													</div>
												
												</div>
												<!--手动配置 END-->
												
												<div class="form-group clearfix">
													<label class="col-xs-6 col-sm-4 col-md-4 col-lg-4 f-label"></label>
													<div class="col-xs-6 col-sm-8 col-md-8 col-lg-8 f-control">
														<button type="submit" class="btn btn-save" onClick="submitNTP()"></button>
													</div>
												</div>
											</form>
										</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			
			</div></div>	 
		</div>
			<!--提示弹窗-->
		<div id="lock_div"></div>
		<div id="message_layer">
			<div id="msg_type" class="wait"></div>
			<div id="msg" class="word"></div>
		</div>
		<script type="text/javascript">
			loadJsQueue(["timeSetting"],true);
			
		</script>
	</body>
</html>
