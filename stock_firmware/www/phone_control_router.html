<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title></title>
    <meta name="viewport"
          content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=yes">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit|ie-comp|ie-stand">
    <meta name="format-detection" content="telephone=no"/>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <script type="text/javascript" src="js/publicPlugin/app.js"></script>
    <script type="text/javascript">
    	document.write("<link rel='stylesheet' type='text/css' href='css/public.css" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
    	document.write("<link rel='shortcut icon' type='image/x-icon' href='favicon.ico" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
    	document.close();
    </script>
    <script type="text/javascript" src="js/publicPlugin/jquery.min.js"></script>	
    <script type="text/javascript" src="js/publicPlugin/jquery.form.js"></script>
    <script type="text/javascript" src="js/publicPlugin/jquery.qrcode.min.js"></script>
    <script type="text/javascript" src="js/publicPlugin/bootstrap.min.js"></script>
    <script type="text/javascript" src="js/publicPlugin/css-vars-ponyfill.js"></script>
    <script type="text/javascript"> 
    	document.write('<script src="js/publicPlugin/dLoad.js' + (isApp().isRemote ? "" : '?_=' + new Date().getTime()) + '"><\/script>');
    	document.close();
    </script>
    <style>
    <style type="text/css">
        body {
            height: 100vh;
            overflow: auto;
            /*backface-visibility: hidden;*/
            /*-webkit-backface-visibility: hidden;*/
            /*transform: translate3d(0,0,0);*/
            transition: background-image .1s;
        }

        .g-wrapper {
            width: 100%;
            height: 100%;
            background: url("./images/phone_bg.jpg") repeat-y center -516px,#f8f8f8;
        }

        .article {
            position: relative;
            /* width: 1200px; */
            height: 100%;
            padding-top: 50px;
            color: #333333;
            line-height: 1;
            transform-origin: 0 0;
            display: flex;
            justify-content: space-between;
        }

        .left-con {
            position: relative;
            width: 750px;
            height: 100%;
            margin-top: 10px;
        }

        .logo {
            width: 340px;
            height: 88px;
            text-indent: -9999px;
            animation: bounceInTop .4s .6s ease-out both;
            background:url("./images/phone_logo_name.png")  no-repeat;
			background-size: 100% auto;
        }

        .desc1 {
            width: 100%;
            font-size: 48px;
            font-weight: bold;
            margin: 44px 0 26px 0;
            line-height: 1.5;
            animation: bounceInTop .4s .4s ease-out both;
        }


        .desc1 strong{
            color: #ffc800;
        }

        .desc2 {
            font-size: 26px;
            animation: bounceInLeft .4s .2s ease-out both;
        }

        .bind-con {
            margin: 33px 0 36px 0;
            width: 100%;
            font-size: 24px;
            animation: scale .4s .6s ease-out both;
        }

        .bind-con .icon {
            position: relative;
            display: inline-block;
            min-width: 600px;
            border: 2px solid #333333;
            border-radius: 6px;
            overflow: hidden;
			text-indent:65px;
            cursor: pointer;
            text-align: left;
            line-height: 54px;
            margin-bottom: 14px;
			padding-right:20px;
        }

        .bind-con .icon:before {
            vertical-align: top;
            content: '';
            width: 54px;
            height: 54px;
            background: url(./images/phone_logo_icon.png) no-repeat center center/32px auto, #333333;
			position:absolute;
			left:0;
			top:0;
        }
        .bind-con .opt_con{
            
        }

        .bind-con .opt_desc {
            width: auto;
            color: #333333;
            line-height: 1;
            border-bottom: 1px solid #333333;
        }


        .qr-code-con {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            padding-bottom: 40px;
            animation: bounceInLeft .4s .6s ease-out both;
        }
		.qr-code-con:nth-of-type(2) {
            justify-content: center;
            align-items: center;
        } 
        .qr-code-con .item {
            height: auto;
            text-align: center;
            margin-right: 60px;
			line-height: initial;
        }

         .qr-code-con .item:last-child {
                    margin-right: 0;
			}

			.qr-code-con .item .img {
				width: 120px;
				height: 120px;
				margin:0 auto;
			}
			
			.qr-code-con .item p:nth-child(2) {
				font-size:18px;
				margin: 20px 0 7px 0;
			}

        .qr-code-con .item p:nth-child(3) {
            font-size: 15px;
        }

        .phone_preview {
            position: relative;
            width: 348px;
            height: 692px;
            text-indent: -9999px;
            background: url("./images/phone_preview.jpg") no-repeat center top/100% auto;
            animation: bounceInRight .4s .6s ease-out both;
        }
        .is-app{
            /*overflow-y: auto;*/
           
        }
        .is-app .g-wrapper{
          /* display: none;*/
            background: url("./images/phone_bg_m.jpg") repeat-y center top/100% auto;
        }
        
        .is-app  .article{
            width: 100%;
            /*backface-visibility: hidden;*/
            /*-webkit-backface-visibility: hidden;*/
        }

        .is-app .left-con {
            width: 84%;
        }

        .is-app .logo {
            margin: 0 auto;
        }

        .is-app .desc1, .is-app .desc1{
            font-size: 40px;
        }
        .is-app .desc1, .is-app .desc2 {
            text-align: center;
        }

        .is-app .desc1 {
            margin-top: 70px;
            line-height: 1.9;
        }
        .is-app .desc2 {
            margin-bottom: 44px;
        }

        .is-app .bind-con {
            display: block;
            /*margin-bottom: 100px;*/
			text-align:center;
        }

        .is-app .bind-con .icon {
            margin: 0 auto 26px;
            background: #eeeeee;
            text-align: center;
            text-indent: 0;
        }

        .is-app .bind-con .opt_desc {
            margin: 20px auto 0;
            text-align: center;
        }

        .is-app .qr-code-con {
            margin: 0 auto;
            justify-content: space-evenly;
        }

        .is-app .qr-code-con .item {
            width: 318px;
            margin-right: 0;
        }
        .is-app .qr-code-con .item .img{
            width: 318px;
            height: 318px;
        }
        .is-app .qr-code-con .item p:nth-child(2){
            font-size: 28px;
            margin: 28px auto 12px;
        }
        .is-app .qr-code-con .item p:nth-child(3){
            font-size: 23px;
        }

        @media (max-width: 767px) {
            .phone_preview {
                display: none;
            }

            .g-wrapper {
                /*display: none;*/
                height: 100vh;
                background-position: center top;
            }

            .article {
                min-width: 750px;
                /*min-height: 1400px;*/
                width: 100%;
                height: 100%;
                text-align: center;
            }
            .left-con{
                margin: 0 auto;
            }
            .phone_preview {
                display: none;
            }
            .logo{
                margin: 0 auto;
            }
            .icon{
                margin: 0 auto;
            }
            .qr-code-con{
                justify-content: space-around;
            }
            .qr-code-con .item{
              margin-right: 0;   
            }
        }
        @media screen and (min-width:767px) and (max-width:1150px){
            .article {
                width: 100%;
                text-align: center;
            }
            .left-con{
                margin: 0 auto;
            }
            .phone_preview {
                display: none;
            }
            .logo{
                margin: 0 auto;
            }
            .icon{
                margin: 0 auto;
            }
            .qr-code-con{
                justify-content: space-around;
            }
            .qr-code-con .item{
                margin-right: 0;
            }
        }
        @media screen and (min-width:1110px) and (max-width:1300px){
            .article {
                width: 100%;
                justify-content: space-evenly;
            }
          
            .phone_preview {
                display: block;
            }
           
        }

        @media screen and (orientation: portrait) {

        }

        @media screen and (orientation: landscape) {
            .article {
                transform-origin: center top;
            }
        }

        @keyframes bounceInLeft {
            0% {
                opacity: 0;
                transform: translateX(-2rem);
            }
            100% {
                transform: translateX(0);
            }
        }

        @keyframes bounceInRight {
            0% {
                opacity: 0;
                transform: translateX(2rem);
            }
            100% {
                transform: translateX(0);
            }
        }

        @keyframes bounceInBot {
            0% {
                opacity: 0;
                transform: translateY(2rem);
            }
            100% {
                transform: translateX(0);
            }
        }

        @keyframes bounceInTop {
            0% {
                opacity: 0;
                transform: translateY(-2rem);
            }
            100% {
                transform: translateX(0);
            }
        }

        @keyframes scale {
            0% {
                transform: scale(1.5);
                opacity: 0;
            }
            80% {
                transform: scale(0.9);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
		
		.modal-body h3 { font-size:21px; margin:0 0 20px; text-align:center; }
		.describe_wrapper { text-align:center } 
		.describe { font-size:14px; color:#999; margin-bottom:20px;display: inline-block;text-align: left; }
		#bindQRcode { margin:0 auto 20px; width:180px; }
		
		.modal-body { padding-top:0px !important; }
		
		@media (max-width: 575px){
			.modal-dialog .modal-content .close {
				display: block;
				margin-top:15px;
			}
		}
		
		.modal.action-sheet .modal-content .modal-header { margin:0; padding:20px 20px 0 0; border:none; }
		
		@media (max-width: 575px){
			.modal.action-sheet .modal-content .modal-header { padding:0 15px 0 0; }
		}
		.step-con{ display: flex; justify-items: center; align-items:center; }
		
		.is-app .step-con{
		    display: block;
		}
		
		.step-con .step:nth-child(2){
		    margin-left:50px;
		    animation: bounceInLeft .4s .6s ease-out both;
		}
		
		.step-con .step:nth-child(3){
		   min-width:250px;
		}
		
		.is-app .step-con .step:nth-child(2){
		    display: none;
		}
		
		@media screen and (max-width: 1150px){
		    .step-con{
		        display: block;
		    }
		    .step-con .step:nth-child(2){
		        display: none;
		    }
		}
		
		.step_title{
		    font-size:18px;
		    line-height: 30px;
		    margin: 50px 0 30px 0;
		    text-align: center;
		    animation: bounceInLeft .4s .6s ease-out both;
		}
		
		.step_title span:nth-child(1) {
		    width:30px;
		    height: 30px;
		    background: #494647;
		    border-radius: 50%;
		    color: #fff;
		    display: inline-block;
		    text-align: center;
		    margin-right: 5px;
		    font-weight: bold;
		}
		
		.is-app .step_title{
		    font-size:35px;
		    margin: 60px 0 40px 0;
		}
		
		.is-app .step_title span:nth-child(1) {
		    width:45px;
		    height: 45px;
		    line-height: 45px;
		}
		
    </style>
</head>
<body>
<div class="g-wrapper">
			<div id="header"></div>
			<div class="d-cnt">
			
				
			

   	<div class="row">
   			<div class=" col-md-8 col-md-offset-2"   >
				<div class="article">
        <!--   <div class="f-locationH3-container"></div>
           <div class="f-content-container">
               
           </div>-->
        <div class="left-con">
            <h2 class="logo">Bee WIFI</h2>
            <p class="desc1"></p>
            <p class="desc2"></p>
            <!-- <div class="bind-con">
				<p class="icon"></p>
				<p class="opt_con"><a class="opt_desc" href="javascript:void(0);"></a></p>
            </div> -->
			<div class="step-con">
			    <div class="step">
			        <div class="step_title">
			            <span>1</span>
			            <span class="step_title_desc"></span>
			        </div>
			        <div class="qr-code-con">
			            <div class="item">
			                <div class="img"></div>
			                <p class="qr-desc"></p>
			                <p class="android"></p>
			            </div>
			            <div class="item">
			                <div class="img"></div>
			                <p class="qr-desc"></p>
			                <p class="iOS"></p>
			            </div>
			        </div>
			    </div>
			    <div class="step">
			        <img src="./images/step_indicator.png" />
			    </div>
			    <div class="step">
			        <div class="step_title">
			            <span>2</span>
			            <span class="step_title_desc"></span>
			        </div>
			        <div class="qr-code-con">
			            <div class="item">
			                <div class="img" id="bindCode"></div>
			                <p class="qr-desc"></p>
			                <p>&nbsp;</p>
			            </div>
			        </div>
			        
			    </div>
			</div>
 </div>
        <p class="phone_preview">APP</p>
		 
		 
    </div>

	
	 </div>
	 </div>
	  </div>
	<div class="modal action-sheet fade" id="bindModal" tabindex="-1">
	  <div class="modal-dialog">
		<div class="modal-content">
		  <div class="modal-header">
			<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">×</span></button>
		  </div>
		  <div class="modal-body">
			<h3 class="title"></h3>
			<div class="describe_wrapper">
				<p class="describe"></p>
			</div>
			<div id="bindQRcode"></div>
		  </div>
		</div>
	  </div>
	</div>
</div>

<script type="text/javascript">
    loadJsQueue(["phone_control_router"]);
</script>
</body>
</html>
