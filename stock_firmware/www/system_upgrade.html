<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title></title>
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=yes, viewport-fit=cover">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
		<meta http-equiv="Expires" content="0">
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
		<meta name="renderer" content="webkit|ie-comp|ie-stand">
		<meta name="format-detection" content="telephone=no"/>
		<link rel="stylesheet" href="css/bootstrap.min.css" />
		<script type="text/javascript" src="js/publicPlugin/app.js"></script>
		<script type="text/javascript">
			document.write("<link rel='stylesheet' type='text/css' href='css/public.css" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.write("<link rel='shortcut icon' type='image/x-icon' href='favicon.ico" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.close();
		</script>
		<script type="text/javascript" src="js/publicPlugin/jquery.min.js"></script>	
		<script type="text/javascript" src="js/publicPlugin/bootstrap.min.js"></script>
		<script type="text/javascript" src="js/publicPlugin/jquery.form.js"></script>
		<script type="text/javascript"> 
			document.write('<script src="js/publicPlugin/dLoad.js' + (isApp().isRemote ? "" : '?_=' + new Date().getTime()) + '"><\/script>');
			document.close();
		</script>
	    <style>
	    	.noTab { padding-top:50px; }
			#update-tip-box { text-align:center;margin: 20px auto 40px; margin-bottom: 40px; margin-top: 20px;max-width: 60%;}
			
			
			@media (max-width: 575px) {
				#update_file_name { border:none; }
				.btn-version-chk,.btn-auto-update { width:100%; }
				#current_version,#cur_version,#new_version { color:#999;}
			}
			#update_form .input-group{ max-width:300px; }
			#update_file_name { width: 100%;}
			#put_file { display:none;}
			.input-group-btn .file-btn {height:36px;width:auto;min-width:inherit;color:#535353;padding:6px 15px;font-size:14px;background:#f5f5f5;border:1px solid #ccc;}
			
			.btn-auto-update {
				margin-left:15px;
			}
			
			.btn-auto-update.off {
				display:none !important;
			}
			
			@media (max-width: 1100px) {
				.btn-auto-update {
					margin-left:0;
					margin-top:20px;
					display:block;
				}
			}
			
	    </style>
	    
	</head>
	<body>
		<div class="g-wrapper">
			<!--头部公用-->   			
			<div id="header"></div>
		    <!--内容-->
		    <div class="totalShell_content">
		    	
		    	<div class="f-locationH3-container">
		    	</div>
				<div class="f-content-container"> 
				<div class="container-fluid">
					<div class="row">
						<div class="col-sm-12 col-md-8 col-md-offset-2">
							<div class="d-cnt">
							<div class="f-smallShell"><!--中间内容--> 
								<div class="f-smallShell-two">
									<div class="tab_area">
										<div class="tab-item selection"></div>
										<div class="tab-item last"></div>
									</div>
								<div class="container-fluid">
									
										<div id="update-tip-box">
												<div class="note-box">
													<div class="wrapper">
														<i class="warning icon"></i>
														<span class="tip-sec"></span>
													</div>
												</div>
											</div>
										<div class="form-sec infoone">
											
											
											<form id="update_form" class="form-area" action="" method="post" enctype="multipart/form-data">
												<div class="form-group clearfix">
													<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
													<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
														<span class="cur_version"></span>
													</div>
												</div>
												
												<!--<div class="form-group clearfix">
							    					<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
														<input type="checkbox" class="hidden checkboxAll" id="mac_checkbox" name="speed_limit" value="1">
														<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
															<div class="button-label  marginTop10 f-switchTrue" >
														        <span class="circle"></span>
														        <span class="text on">ON</span>
														        <span class="text off">OFF</span>
														   </div>
														 
													    </div>
												</div>-->
												
												
												<div class="form-group clearfix">
													<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
													<div class="col-xs-6 ccol-sm-8 col-md-8 col-lg-7 f-control">
													
														<div class="input-group">
															<input type="text" class="form-control" id="update_file_name" readonly onclick="get_file();">
															<span class="input-group-btn">
																<label class="btn file-btn" for="put_file">
																	<input id="put_file" name="file1" type="file" style="display:none;" onChange="put_fileFn()">
																	<span class="view"></span>
																</label>
															</span>
														</div>
													</div>
												</div>
												
												<div class="form-group clearfix">
													<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 "></label>
													<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
														<button type="button" class="btn btn-confirm" onClick="submit_file()"></button>
													</div>
												</div>
											</form>
											<iframe name="stop" class="hidden"></iframe>
										</div>
										
										<!--自动升级-->
							    	<div class="infoone marginTop40 hidden">	
							    		
							    			<div class="form-group clearfix">
							    					<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
													
													<input type="checkbox" class="hidden checkboxAll" id="auto_update_checkbox" name="speed_limit" >
													<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
														<div class="button-label  marginTop10 enable_click" >
													        <span class="circle"></span>
													        <span class="text on">ON</span>
													        <span class="text off">OFF</span>
													   </div>
													   <p class="tipsText marginTop10" style="width: 71%;"></p>
												    </div>
											</div>
											<div class="hidden">
											<div class="form-group clearfix" id="urgent_update">
							    					<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
													
													<input type="checkbox" class="hidden checkboxAll" id="urgent_update_checkbox" name="urgent_update_checkbox" >
													<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control" >
														<div class="button-label  marginTop10 enable_click" >
													        <span class="circle"></span>
													        <span class="text on">ON</span>
													        <span class="text off">OFF</span>
													   </div>
													   <p class="tipsText marginTop10" style="width: 71%;"></p>
												    </div>
											</div>
												</div>
											<div class="form-group clearfix hidden" >
							    					<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
													
													<input type="checkbox" class="hidden checkboxAll" id="agent_update_checkbox" value="1" name="agent_update_checkbox" >
													<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control" >
														<div class="button-label  marginTop10 f-switchTrue enable_click agent" >
													        <span class="circle"></span>
													        <span class="text on">ON</span>
													        <span class="text off">OFF</span>
													   </div>
													   
												    </div>
											</div>		
											<div class="form-group clearfix">
												<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>	
												<div class=" col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control " id="span_cur_version"><span class="version-status"></span>  <span  class="cur_version"></span> </div>
												
												
											</div>
											
											<div class="form-group clearfix hidden" id="span_new_version_div">
												<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 "></label>
												<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control"><span class="version-status"></span><span id="span_new_version" class="marginLeft5"></span></div>
											</div>
											
											<div class="form-group clearfix">
												<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 "></label>	
												<div class=" col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control " id="update_status"> </div>
											</div>
										
											
											
											<div class="form-group clearfix marginTop20">
													<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 "></label>
													<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
														<button type="button" class="btn  button-version-checking" id="check_btn" onClick="version_check_button()"></button>
														<button type="button" class="btn  button-automatic-upgrade hidden" id="update_btn" onClick="start_update()"></button>

													</div>
											</div>
							    		</div>
										
										<div class="infoone hidden">
											<div class="countdown-sec">
												<img width="120" src="./images/turn.gif" />
												<div id="time">160</div>
											</div>	
											<p class="countdown-tip" id="reset_tip"></p>
										</div>
									
								</div>
							</div>
							</div>
						</div>
							</div>
						</div>
					</div>
				</div>
		    </div>
		</div>
		</div>	
		
		<div class="modal fade" id="updateModal" tabindex="-1">
		  <div class="modal-dialog">
			<div class="modal-content">
			  <div class="modal-header">
				<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
				<h4 class="modal-title"></h4>
			  </div>
			  <div class="modal-body">
				
			  </div>
			  <div class="modal-footer">
				<button type="button" class="dialog-btn btn-cancel" data-dismiss="modal"></button>
				<button type="button" class="dialog-btn btn-confirm"></button>
			  </div>
			</div>
		  </div>
		</div>
		
		
    	<!--一个遮罩，重启成功后就显示让用户禁止点击-->
    	<div class="fullScreenMask hidden"></div>
	
		<div id="lock_div"></div>
		<div id="message_layer">
		    <div id="msg_type" class="wait"></div>
		    <div id="msg" class="word"></div>
		</div>
		
		<script type="text/javascript">
			loadJsQueue(["system_upgrade"]);
			
		</script>
	</body>
</html>
