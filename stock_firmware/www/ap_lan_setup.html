<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title></title>
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=yes, viewport-fit=cover">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
		<meta http-equiv="Expires" content="0">
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
		<meta name="renderer" content="webkit|ie-comp|ie-stand">
		<meta name="format-detection" content="telephone=no"/>
		<link rel="stylesheet" href="css/bootstrap.min.css" />
		<script type="text/javascript" src="js/publicPlugin/app.js"></script>	
		<script type="text/javascript">
			removeDir();
			setPath("index");
		</script>	
		<script type="text/javascript"> 
			document.write("<link rel='stylesheet' type='text/css' href='css/public.css" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.write("<link rel='shortcut icon' type='image/x-icon' href='favicon.ico" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.close();
		</script>
		<script type="text/javascript" src="js/publicPlugin/jquery.min.js"></script>
		<script type="text/javascript" src="js/publicPlugin/bootstrap.min.js"></script>		
		<script type="text/javascript"> 
			document.write('<script src="js/publicPlugin/dLoad.js' + (isApp().isRemote ? "" : '?_=' + new Date().getTime()) + '"><\/script>');
			document.close();
		</script>	
		<style type="text/css">
		.f-explain { color:#b3b3b3; }
		#login_site { font-weight:bold; padding:0 3px; }
		</style>
	</head>
	<body >
		<div class="g-wrapper">
			
			<div id="header"></div>
		    <!--内容-->
		    <div class="totalShell_content">
		    	<div class="f-locationH3-container">
		    	</div>
				<div class="f-content-container">
					<div class="row">
						<div class="col-sm-12 col-md-8 col-md-offset-2">
							<div class="d-cnt">
							<div class="f-smallShell"><!--中间内容--> 
								<div class="f-smallShell-two">
									<div class="tab_area hidden">
										<div class="tab-item selection"></div>
										<div class="tab-item last"></div>
									</div>
							<!--ipv4-->
							<div class="infoone">
								<div class="container-fluid">
									<div class="row">
										<div class="form-sec">	
										
											<form class="form_intranetSettings" id="form_intranetSettings" onSubmit="return false" style="margin-top:30px;"><!--form表单在此-->	

												
												
											<div class="routing_show hidden">
												
										
												<div class="form-group clearfix">
													<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
													<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
														<input type="text" id="lan_ip_address" name="lan_ip" class="form-control zt" maxlength="15" size="27" />
													</div>
												</div>
												
												<div class="form-group clearfix" style="margin-top: -10px;margin-bottom: 10px;">
													<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 "></label>
													<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control ">
														<p class="f-explain"></p>
													</div>
												</div>
												
												<div class="form-group clearfix">
													<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
													<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
														<input type="text" id="lan_sub_mask" name="lan_mask" class="form-control zt" maxlength="15" size="27" />
													</div>
												</div>
												
												<div class="form-group clearfix">
													<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
													<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
														<input type="radio" class="hidden checkboxAll" id="dhcp_enable_hidden"  value="1"  checked>
														<div class="button-label f-switchTrue marginTop8 enable_click zt">
															<span class="circle"></span>
															<span class="text on">ON</span>
															<span class="text off">OFF</span>
														</div>
													</div>
												</div>
												
												
												<div class="form-group clearfix">
													<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
													<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
														<input type="text" id="dhcp_pool_start"  name="dhcp_start" class="form-control zt" maxlength="15" size="27" />
													</div>
												</div>
												
												
												<div class="form-group clearfix">
													<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
													<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
														<input type="text" id="dhcp_pool_end" name="dhcp_end" class="form-control zt" maxlength="15" size="27" />
													</div>
												</div>
												
												<div class="form-group clearfix">
													<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 "></label>
													<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
														<button type="submit" class="btn btn-save zt" onClick="lan_set();"></button>
													</div>
												</div>
											</div>	
												
												<div class="bridge_show hidden">
													
												
												<!--动态获取-->
												<div class="form-group clearfix">
													<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
													<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
														<input type="radio" class="hidden checkboxAll" id="get_dynamic_enable"  value="1"  checked>
														<div class="button-label f-switchTrue marginTop8 enable_click zt">
															<span class="circle"></span>
															<span class="text on">ON</span>
															<span class="text off">OFF</span>
														</div>
													</div>
												</div>
												
												<div id="wan_text">
													<div class="form-group clearfix">
														<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
														<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
												  			<span id="wan_setup_ip_text" class="f-light-36"></span>
												  		</div>
													</div>
													<div class="form-group clearfix">
														<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
														<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
												  			<span id="wan_setup_mask_text" class="f-light-36"></span>
												  		</div>
													</div>
													<div class="form-group clearfix">
														<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
														<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
												  			<span id="wan_setup_gw_text" class="f-light-36"></span>
												  		</div>
													</div>
													<div class="form-group clearfix">
														<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
														<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
												  			<span id="wan_setup_dns_text" class="f-light-36"></span>
												  		</div>
													</div>
													<div class="form-group clearfix">
														<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 "></label>
														<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
															<button type="submit" class="btn btn-save get_dynamic_bt" onClick="set_brlan_config(1);"></button>
														</div>
													</div>
												</div>
												
											<div id="wan_input" class="hidden">
												<div class="form-group clearfix">
													<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
													<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
											  			<input type="text" id="wan_setup_ip" name="ip" maxlength="15" autocomplete="off" class="form-control  f-input-w300"  placeholder="">
											  		</div>
												</div>
									
												<div class="form-group clearfix">
														<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
														<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
												  			<input type="text" id="wan_setup_mask" name="mask" maxlength="15" autocomplete="off"  class="form-control  f-input-w300"  placeholder="">
												  		</div>	
												</div>
												
												<div class="form-group clearfix">
														<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
														<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
												  			<input type="text" id="wan_setup_gw" name="gw" maxlength="15" autocomplete="off"  class="form-control  f-input-w300"  placeholder="">
												
														</div>
												</div>
												<div class="form-group clearfix">
														<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
														<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
												  			<input type="text" id="wan_setup_dns" name="gw" maxlength="15" autocomplete="off"  class="form-control  f-input-w300"  placeholder="">
												
														</div>
												</div>
												
												
												<div class="form-group clearfix">
													<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 "></label>
													<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
														<button type="submit" class="btn btn-save get_dynamic_bt" onClick="set_brlan_config(0);"></button>
													</div>
												</div>
												</div>
												</div>
											
											</form>
										</div>
									</div>
								</div>													
							</div>
							
							<!--ipv6-->
							<div class="infoone hidden">
								<div class="container-fluid">
									<div class="row">
										<div class="form-sec">	
										
								<form class="form_ipv6_id" id="form_ipv6_id" onSubmit="return false" style="margin-top:30px;"><!--form表单在此-->	

									<div class="form-group clearfix">
										<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
										<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control coverSelect">
											<select  name="ip_address_ipv6" id="ip_address_ipv6">
											</select>
										</div>
									</div>
									<div class="form-group clearfix">
													<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 "></label>
													<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
														<button type="submit" class="btn btn-save" onClick="lan_ipv6_set();"></button>
													</div>
												</div>
								</form>
								</div>
								</div>
								</div>
							</div>
							
							
							<div class="infoone hidden">
								<div class="countdown-sec">
									<img width="120" src="./images/turn.gif" />
									<div id="time">15</div>
								</div>	
								<p class="countdown-tip" id="reset_tip"></p>
							</div>
							</div>
						</div>
						</div>
					</div>
				</div>
		    </div>
		</div>
	</div>
		<script type="text/javascript">
			loadJsQueue(["ap_lan_setup"],true);
		
		</script>
	</body>
</html>
