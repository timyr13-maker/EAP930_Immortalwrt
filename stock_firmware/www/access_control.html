<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title></title>
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=yes, viewport-fit=cover">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
		<meta http-equiv="Expires" content="0">
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
		<meta name="renderer" content="webkit|ie-comp|ie-stand">
		<meta name="format-detection" content="telephone=no"/>
		<link rel="stylesheet" href="css/bootstrap.min.css" />
		<script type="text/javascript" src="js/publicPlugin/app.js"></script>
		<script type="text/javascript">
			document.write("<link rel='stylesheet' type='text/css' href='css/public.css" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.write("<link rel='shortcut icon' type='image/x-icon' href='favicon.ico" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.close();
		</script>
		<script type="text/javascript" src="js/publicPlugin/jquery.min.js"></script>	
		<script type="text/javascript" src="js/publicPlugin/bootstrap.min.js"></script>
		<script type="text/javascript"> 
			document.write('<script src="js/publicPlugin/dLoad.js' + (isApp().isRemote ? "" : '?_=' + new Date().getTime()) + '"><\/script>');
			document.close();
		</script>
		<style>
			#alias_show{white-space:pre-wrap}
			#access_contorl_table tbody tr td span{
				line-height: 20px;
			    display: block;
			}
			.blue_title{
				    float: right;
				    color: #2E9BFF;
				    font-size: 16px;
				    margin-top: 20px;
			}
		</style>
	</head>
	<body>
		<div class="g-wrapper">
			 <!--头部公用-->   
		<div id="header"></div>
			
		    <!--内容-->
		    <div class="totalShell_content">
		    	<div class="f-locationH3-container">
		    	</div>
		<div class="f-content-container">
				
    	<div class="container-fluid">
			<div class="row">
				<div class="col-sm-12 col-md-8 col-md-offset-2">
							<div class="d-cnt">
				
					<div class="f-smallShell"><!--中间内容--> 
						<div class="f-smallShell-two">
									
					<!--第一页-->				
	 			<div class="infoone">
			    	<div class="container-fluid">
					<div class="row">
				        <div class="box-bd table-sec">
				        	<div class="cnt-header clearfix">
								<h2 class="title"></h2>
								<span class="blue_title"></span>
							</div>
				            <table  class="data-table table table-striped "  id="access_contorl_table"></table>
				        </div>
				    </div>
				 	</div>
						  
						
					<div class="page"></div>
					<div class="form-group clearfix marginTop20">
						<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5"></label>
						<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
							<button type="button" class="btn btn-add" id="list_one" onclick="jump_form(1,'add')"></button>
							
						</div>
					</div>
					
		   		</div>	
		   		<!--第二页-->
		   		<div class="infoone hidden">
			    	<div class="container-fluid">
					<div class="row">
				        <div class="box-bd table-sec">
				            <table  class="data-table table table-striped "  id="get_host_info_table"></table>
				            <div style="width: 90%;margin: 0 auto;" class="text-right">
				            	<button type="button" class="limit-speed-button smaller" onclick="show_all_equipment();"></button>
				            </div>
				        </div>
				    </div>
				 	</div>
						  
						
					<div class="page"></div>
					<div class="form-group clearfix">
						<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5"></label>
						<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
							<button type="button" class="btn btn-add" id="list_two" onclick="jump_form(2)"></button>
							<button type="button" class="btn btn-cancel" onclick="jump_form(0)"></button>
						</div>
					</div>
					
		   		</div>	
		   		
			<div class="infoone hidden">
				
		    		<!--form表单在此-->		
					<form class="form_wireless_universal_relay marginTop40"  onsubmit="return false"><!--form表单在此-->	
						
						<div class="form-group clearfix">
							<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
							<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
								<span id="alias_show" style="    display: inline-block;line-height: 35px;"></span>
							</div>
						</div>
						
						<div class="form-group clearfix  ">
							<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
							<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
							 <span class="br_f">
								<div class=" pull-left   ">
							      <input type="text" name="start_hour" class="form-control  form-control-small allChange" id="start_hour" onkeyup="value=value.replace(/\D/g,'')"   value="00" maxlength="2" autocomplete="off">
							    </div>
							    <b class='pull-left marginRight10 marginLeft10 f-lineHeight'>:</b>
							    <div class=" pull-left  ">
							      <input type="text" name="start_minute" class="form-control  form-control-small allChange" id="start_min" onkeyup="value=value.replace(/\D/g,'')" maxlength="2" value="00" autocomplete="off">
							    </div>
							   <b class='pull-left marginRight10 marginLeft10  f-lineHeight app_hide'>~</b>
							  </span>
							     <div class=" pull-left   ">
							      <input type="text" name="start_sec" class="form-control  form-control-small allChange" id="end_hour" onkeyup="value=value.replace(/\D/g,'')" maxlength="2" value="00" autocomplete="off">
							    </div>	
							     <b class='pull-left marginRight10 marginLeft10 f-lineHeight'>:</b>
							    <div class=" pull-left  ">
							      <input type="text" name="start_minute" class="form-control  form-control-small allChange" id="end_min" onkeyup="value=value.replace(/\D/g,'')" maxlength="2" value="00" autocomplete="off">
							    </div>
							</div>	
						</div>
					

							<div class="form-group clearfix">
								<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
								<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control weekSlot ">
										<span class="active" value="1"></span>
										<span class="active" value="1"></span>
										<span class="active" value="1"></span>
										<span class="active" value="1"></span>
										<span class="active" value="1"></span>
										<span class="active" value="1"></span>
										<span class="active" value="1"></span>
										<input type="hidden" name="timer_day" class="weekSlotVal" value="1111111">
									
								</div>
							</div>
							
							
							<div class="form-group clearfix">
								<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5"></label>
								<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
									<button type="button" class="btn btn-save" id="add_btn" onclick="ap_timer_set(0)"></button>
									<button type="button" class="btn btn-save hidden" id="add_btn1" onclick="ap_timer_set(1)"></button>
									<button type="button" class="btn btn-cancel" onclick="jump_form(0)"></button>
								</div>
							</div>
					</form>
	     			
		    	</div>
		   </div>
		    	
		    </div>
		    </div>
		    </div>
		    </div>
		    </div>
		    </div>
		    </div>
		</div>
			<!--原来的过渡动画弹窗效果-->
    	<div id="lock_div"></div>
		<div id="message_layer">
		    <div id="msg_type" class="wait"></div>
		    <div id="msg" class="word"></div>
		</div>	
		
		<!--删除二次确认-->
		<div class="modal fade" id="dataModal" tabindex="-1">
		  <div class="modal-dialog">
			<div class="modal-content">
			  <div class="modal-header">
				<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
				<h4 class="modal-title"></h4>
			  </div>
			  <div class="modal-body">
			  </div>
			  <div class="modal-footer">
				<button type="button" class="dialog-btn btn-cancel" data-dismiss="modal"></button>
				<button type="button" class="dialog-btn btn-confirm"></button>
			  </div>
			</div>
		  </div>
		</div>
		
		<script type="text/javascript">
			loadJsQueue(["access_control"],true);
			
		</script>
	</body>
</html>
