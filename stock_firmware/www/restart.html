<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title></title>
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=yes, viewport-fit=cover">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
		<meta http-equiv="Expires" content="0">
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
		<meta name="renderer" content="webkit|ie-comp|ie-stand">
		<meta name="format-detection" content="telephone=no"/>
		<link rel="stylesheet" href="css/bootstrap.min.css" />
		<script type="text/javascript" src="js/publicPlugin/app.js"></script>
		<script type="text/javascript">
			document.write("<link rel='stylesheet' type='text/css' href='css/public.css" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.write("<link rel='shortcut icon' type='image/x-icon' href='favicon.ico" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.close();
		</script>
		<script type="text/javascript" src="js/publicPlugin/jquery.min.js"></script>	
		<script type="text/javascript" src="js/publicPlugin/bootstrap.min.js"></script>
		<script type="text/javascript"> 
			document.write('<script src="js/publicPlugin/dLoad.js' + (isApp().isRemote ? "" : '?_=' + new Date().getTime()) + '"><\/script>');
			document.close();
		</script>
	    <style>
	  		.modal-footer .btn-edit{    background: var(--blue-12);color: #fff;}
	    	.select_All{vertical-align: middle;}
	    	#restart_table thead tr th:nth-child(2):hover,
	    	#restart_table thead tr th:nth-child(3):hover,
	    	/* #restart_table thead tr th:nth-child(7):hover, */
	    	#restart_table thead tr th:nth-child(6):hover,
	    	#restart_table thead tr th:nth-child(5):hover
	    	{
	    		cursor: pointer;
	    		background-color: var(--blue-12);
	    		color:var(--white);
	    		 
	    	}
			.quick_span {
			    cursor: pointer;
			}
			#select_page{margin-left: 6%;margin-right: 5px;}
	    </style>
	</head>
	<body>
		<div class="g-wrapper">
			 <!--头部公用-->   
		<div id="header"></div>
			
		    <!--内容-->
		    <div class="totalShell_content">
		    	<div class="f-locationH3-container">
		    	</div>
		    		<div class="f-content-container">   
		    	<div class="container-fluid">
					<div class="row">
						<div class="col-md-8 col-md-offset-2">
							<div class="d-cnt">
							<div class="f-shell"><!--中间内容--> 
								<div class="f-smallShell-two">
									
									
							<!--form表单在此-->	
							<div class="infoone">
								<div class="container-fluid">
									<div class="row">
										<div class="form-sec">
		    			
								
						
							<div id="restart_list" class="tab-pane">
								<!--表格-->
						        <div class="table-sec marginTop20">
						        	
						            <table  class="data-table table table-striped "  id="restart_table"></table>
						            <div style="margin-top: 20px;">
						            	<input type="checkbox" name="checkboxShall" value="0" id="select_page" class="checkboxShall">
						            	<label class="select_all_page"></label>
						            </div>
						            <div  class="form-group text-center marginTop20">
						            	<button type="button" class="btn btn-nowRestart"></button>
						            	<button type="button" class="btn btn-scheduled-restart"></button>
						            </div>
						        </div>
					        </div>
					        <div class="modal fade" id="restart_details" tabindex="-1">
								  <div class="modal-dialog">
									<div class="modal-content">
									  <div class="modal-header">
										<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
										<h4 class="modal-title"></h4>
									  </div>
									  <form action="javascript:void(0);" id="add_url_frm" name="add_url_frm" method="post">
										  <div class="modal-body">	
											<div class="form-group clearfix">
												<div class="col-xs-6  col-sm-offset-0 col-sm-4 col-md-4 col-lg-4 f-label-w">
													<label class="f-label" for="restart_enable"></label>
												</div>
												<div class="col-xs-6  col-sm-offset-0 col-sm-8 col-md-8 col-lg-8 f-control">
													<input type="checkbox" class="hidden checkboxAll checkboxClick" id="restart_enable" name="wifi_enable" value="0" checked="checked">
													<label for="toggle-button" class="button-label marginTop8 enable_click">
														<span class="circle"></span>
														<span class="text on">ON</span>
														<span class="text off">OFF</span>
													</label>
												</div>
											</div>
											
											<div class="form-group clearfix">
												<div class="col-xs-6  col-sm-offset-0 col-sm-4 col-md-4 col-lg-4 f-label-w">
													<label class="f-label" for="url_schedulesType"></label>
												</div>
												<div class="col-xs-6  col-sm-offset-0 col-sm-8 col-md-8 col-lg-8 f-control ">
													<div class=" pull-left  ">
														<input type="text" name="start_hour" class="form-control  form-control-small allChange" id="hour" onkeyup="value=value.replace(/\D/g,'')" value="00" maxlength="2" autocomplete="off">
													 </div>
													<b class="pull-left marginRight10 marginLeft10 f-lineHeight">:</b>
													<div class=" pull-left  ">
												      <input type="text" name="start_minute" class="form-control  form-control-small allChange" id="min" onkeyup="value=value.replace(/\D/g,'')" maxlength="2" value="00" autocomplete="off">
												    </div>
												</div>
											</div>
											
											<div class="form-group clearfix">
												<div class="col-xs-6  col-sm-offset-0 col-sm-4 col-md-4 col-lg-4 f-label-w">
													<label class="f-label" for="url_schedulesType"></label>
												</div>
												<div class="col-xs-6  col-sm-offset-0 col-sm-8 col-md-8 col-lg-8 f-control weekSlot">
														<span class="active" value="1" span="1"></span>
														<span class="active" value="1" span="1"></span>
														<span class="active" value="1" span="1"></span>
														<span class="active" value="1" span="1"></span>
														<span class="active" value="1" span="1"></span>
														<span class="active" value="1" span="1"></span>
														<span class="active" value="1" span="1"></span>
														<input type="hidden" name="timer_day" class="weekSlotVal" value="1111111">
													
												</div>
											</div>
										  </div>
										  <div class="modal-footer">
											<button type="button" class="dialog-btn btn-cancel" data-dismiss="modal"></button>
											<button type="submit" class="dialog-btn btn-edit"></button>
										  </div>
									  </form>
									</div>
								  </div>
								</div>
					        
					        <!--立即重启-->
					        <div class="modal fade" id="resetModal" tabindex="-1">
							  <div class="modal-dialog">
								<div class="modal-content">
								  <div class="modal-header">
									<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
									<h4 class="modal-title"></h4>
								  </div>
								  <div class="modal-body">
								  </div>
								  <div class="modal-footer">
									<button type="button" class="dialog-btn btn-cancel" data-dismiss="modal"></button>
									<button type="button" class="dialog-btn btn-confirm"></button>
								  </div>
								</div>
							  </div>
							</div>
	     			</div>
		    	</div>
		    </div>   </div>
		  
		      </div>
		    </div>
		    </div>
		    </div>
		    </div>
		    </div>
		    </div>
		    </div>
		</div>
				<!--原来的过渡动画弹窗效果-->
    	<div id="lock_div"></div>
		<div id="message_layer">
		    <div id="msg_type" class="wait"></div>
		    <div id="msg" class="word"></div>
		</div>
		

		
    	<script type="text/javascript">
			loadJsQueue(["restart"],true);
		</script>
	</body>
</html>
