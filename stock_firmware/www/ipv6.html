<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title></title>
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=yes, viewport-fit=cover">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
		<meta http-equiv="Expires" content="0">
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
		<meta name="renderer" content="webkit|ie-comp|ie-stand">
		<meta name="format-detection" content="telephone=no"/>
		<link rel="stylesheet" href="css/bootstrap.min.css" />
		<script type="text/javascript" src="js/publicPlugin/app.js"></script>	
		<script type="text/javascript">
			removeDir();
			setPath("index");
		</script>	
		<script type="text/javascript"> 
			document.write("<link rel='stylesheet' type='text/css' href='css/public.css" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.write("<link rel='shortcut icon' type='image/x-icon' href='favicon.ico" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.close();
		</script>
		<script type="text/javascript" src="js/publicPlugin/jquery.min.js" ></script>
		<script type="text/javascript" src="js/publicPlugin/bootstrap.min.js"></script>		
		<script type="text/javascript"> 
			document.write('<script src="js/publicPlugin/dLoad.js' + (isApp().isRemote ? "" : '?_=' + new Date().getTime()) + '"><\/script>');
			document.close();
		</script>
	    
	</head>
	<body>
		<div class="g-wrapper">
			 <!--头部公用-->   
			<div id="header"></div>
			
		    <!--内容-->
		    <div class="totalShell_content">
		    	<div class="f-locationH3-container"></div>
		    <div class="f-content-container">
					<div class="row ">
						<div class="col-sm-12 col-md-8 col-md-offset-2">
							<div class="d-cnt">
		    <div class="f-smallShell "><!--中间内容--> 
		    	<div class="f-smallShell-two " style="padding-bottom: 20px;">
		    		
					
			
		    	
		    	

		
				<div class="form-sec">
		    	
		    <!--ipv6数据-->
		    		<form name="netWork_pppoe_form" method="post" style="position: relative;">
		    			<div class="form-group clearfix marginTop70" >
								<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
								<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
									<input type="checkbox" class="hidden checkboxAll checkboxClick" id="ipv6_switch" name="ap_hidden" value="1" checked="checked">
									<label for="toggle-button" class="button-label f-switchTrue marginTop8 enable_click">
										<span class="circle"></span>
										<span class="text on">ON</span>
										<span class="text off">OFF</span>
									</label>
								</div>
							</div>
						<div class="form-group clearfix ">
								<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
								<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control coverSelect" >
							     	<select  id="internet_access_ipv6" class="ipv6_s" >	</select>
							    </div>
						</div>
					
					

		    		<!--ipv6 自动获取（DHCPv6)-->
		    		<div class=" marginTop30 ">	
						
							<!--ipv6  手动-->
					    		<div  id="ipv6_pppoe_form">	
					    			<div class="form-group clearfix">
												<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
												
												<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
										  			<input type="text" id="ipv6_static_ip" name="ipv6_static_ip"  autocomplete="off" class="form-control  f-input-w300 ipv6_s"  placeholder="">
										  			<span>/</span>
										  			<input type="text" class="form-control f-input-w300 ipv6_s" name="ipv6_static_ip_prefix" id="ipv6_static_ip_prefix" maxlength="3" style="width: 50px; ">
												</div>
									</div>
									<div class="form-group clearfix">
												<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
												<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
										  			<input type="text" id="ipv6_static_ipprefix" name="ipv6_static_ipprefix"  autocomplete="off" class="form-control  f-input-w300 ipv6_s"  placeholder="">
										  			<span>/</span>
										  			<input type="text" class="form-control f-input-w300 ipv6_s" name="text_ipv6" id="ipv6_wanprefix" maxlength="3" style="width: 50px; ">
												</div>
									</div>
								
					    		
					    		<div class="form-group clearfix">
										<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
										<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
								  			<input type="text" id="ipv6_wan_setup_gw" name="gw"  autocomplete="off" class="form-control  f-input-w300 ipv6_s" placeholder="">
								
										</div>
								</div>
								
								
								
								
					    		</div>
					    		
					    		
							<div class="form-group clearfix">
									<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
									<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
								    <label class="radio2 radio_size f-color1 radio2 marginTop5">
									    <input type="radio" name="ipv6_dhcp_dns_radio"  class=" ipv6_s " value="automatic" checked=""> 
									  
								    	<span class="font_size14 routing-mode-ipv6"></span>
								    	
									</label>
									 <label class="radio2 radio_size f-color1 radio2 marginTop5">
									     <input type="radio" name="ipv6_dhcp_dns_radio"  class=" ipv6_s " value="manual" > 
									    
								    	<span class="font_size14 routing-mode-ipv6"></span>
									</label>
									</div>
							</div>
							
							<div id="dns_dhcp_ipv6" class="hidden">
								<div class="form-group clearfix">
									<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
									<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
							  			<input type="text" id="ipv6_dhcp_dns_name" name="dns1"  autocomplete="off" class="form-control  f-input-w300 ipv6_s"  placeholder="">
							  			
							  		</div>
								</div>
								
								<div class="form-group clearfix">
									<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
									<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
							  			<input type="text" id="ipv6_dhcp_dns_name2" name="dns2"  autocomplete="off" class="form-control  f-input-w300 ipv6_s"  placeholder="">
							  			<span class="font_size14 prompt_text_ipv6"></span>
							  		</div>
								</div>
							</div>
							<div class="form-group clearfix">
								<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 "></label>
								<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
									<button type="button" id="ipv6_submit_really" class="btn btn-save zt" onClick="ipv6_submit()"></button>
									<!--<button type="button" id="ipv6_submit_false" disabled="disabled" class="btn btn-save"></button>-->
								</div>
							</div>
						
		    		</div>
		    		
		    		</form>
		    	</div>
		  
		    	<!--ipv6数据结束-->
		    		
				    	
		    		
		   </div>
		    	</div>
		    </div></div>
		    	 </div>
		    	</div>
		    </div>
		</div>
		<!--提示弹窗-->
		<div id="lock_div"></div>
		<div id="message_layer">
			<div id="msg_type" class="wait"></div>
			<div id="msg" class="word"></div>
		</div>
		<script type="text/javascript">
			loadJsQueue(["ipv6"]);
			
		</script>	
	</body>
</html>
