<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title></title>
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=yes, viewport-fit=cover">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
		<meta http-equiv="Expires" content="0">
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
		<meta name="renderer" content="webkit|ie-comp|ie-stand">
		<meta name="format-detection" content="telephone=no"/>
		<link rel="stylesheet" href="css/bootstrap.min.css" />
		<script type="text/javascript" src="js/publicPlugin/app.js"></script>	
		<script type="text/javascript">
			storeApp();
			removeDir();
			setPath("exit");
			setAppParam();
		</script>
		<script type="text/javascript">
			document.write("<link rel='stylesheet' type='text/css' href='css/public.css" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.write("<link rel='stylesheet' type='text/css' href='css/inside.css" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.write("<link rel='stylesheet' type='text/css' href='css/index.css" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.write("<link rel='shortcut icon' type='image/x-icon' href='favicon.ico" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.close();
		</script>
		<script type="text/javascript" src="js/publicPlugin/jquery.min.js"></script>	
		<script type="text/javascript" src="js/publicPlugin/bootstrap.min.js"></script>
		<script type="text/javascript"> 
			document.write('<script src="js/publicPlugin/dLoad.js' + (isApp().isRemote ? "" : '?_=' + new Date().getTime()) + '"><\/script>');
			document.close();
		</script>
		<style>
			#info-panel .panel-box {
    background: #fff;
    border-radius: 10px;
	-webkit-box-shadow: 0px 0px 5px 0px rgb(148 169 196 / 28%);
	box-shadow: 0px 0px 5px 0px rgb(148 169 196 / 28%);
	padding-bottom:20px;
	font-size:18px;
	color:#848484;
}.ap-search-con{
				width: 50%;
				float: left;
			}
			.ap-search-con .btn{
				text-indent: -9999px;
			}
			.ap-search-con .btn:hover,.ap-search-con .btn:focus{
				background: transparent;
				border-color: var(--ctl-border);
			}
			.ap-search-con .btn i{
				display: block;
				width: 20px;
				height: 20px;
				margin: 0 auto;
				vertical-align: middle;
				-webkit-mask: url(./images/page_search_icon.svg) no-repeat 0 0/contain;
				mask: url(./images/page_search_icon.svg) no-repeat 0 0/contain;
				background: var(--text-table);
			}
			.ap-search-con .btn:hover i{
				background: var(--module-blue);
			}
			.title_show{
				    		color: var(--text-table);
				    		text-align: center;
				    		font-size: 14px;
				    		display: inline-block;
				    		float: right;
				    		line-height: 25px;
				    		
				    	}
			.online_quantity{color: var(--module-blue);font-weight: 400;}
			.offline_quantity{color: var(--red);font-weight: 400;}
			.equipment_online{cursor: pointer;}
			.is_pc{width: 20px; height: 20px;background: url(./images/wired_icon2.png) no-repeat 0 0/contain;}
			.is_app{width: 20px; height: 20px;background: url(./images/wired_icon3.png) no-repeat 0 0/contain;}
			#ac_list_modal .modal-dialog{width: 70%; overflow-x: auto;}
			.prompts{width: 90%;margin: 0 auto;height: 30px;}
			.wired_ico_pc{width: 32px;height: 30px;vertical-align: middle;display:inline-block;background-image: url(./images/wired_icon2.png);background-size: auto 100%;background-repeat: no-repeat;}
			.wired_ico_mobile{width: 29px;height: 30px;display:inline-block;vertical-align: middle;background-image: url(./images/wired_icon3.png);background-size: auto 100%;background-repeat: no-repeat;}
			@media screen and (max-width:600px){
				.prompts:after{
					display: block;
				}
				.ap-search-con{
					width: 100%;
					margin-bottom: 10px;
				}
				.table-sec.small-screen{
					width: 100%;
					margin-top: 50px;
				}
			}

		</style>
	</head>
	<body>
		<div class="g-wrapper">
			<div class="d-cnt off">
<div id="header"></div>
			<div id="info-panel">
				 
				<div class="container-fluid">
					<div class="row">
						<div class="col-md-8 col-md-offset-2">
							<div class="panel-box">
								
								<div id="net-status-box" class="clearfix">
										<!--<div class="col-xs-12 col-sm-6 col-md-3 col-lg-3">
											<img class="router_brand" src="images/my_router.jpg" />
											<p id="router_name_index" class="marginTop20 text-center">netcore-AC-100</p>
										</div>-->
										<div class="col-xs-12 col-sm-6 col-md-4 col-lg-4">
											<div class="ix_p2">
												<div class="net_status_title">
													<h6 class="f-title"></h6>
													<p id="host-val"></p>
												</div>
												<i class="boder_rigit"></i>
											</div>
											<div class="status_box">
												<p>
													<span class="sp_describe"></span>
													<span id="idx_time"></span>
												</p>
												<p>
													<span class="sp_describe"></span>
													<span id="run_time"></span>
												</p>
												<i class="boder_rigit"></i>
											</div>
											
										</div>
										<div class="col-xs-12 col-sm-6 col-md-4 col-lg-4">
											<div class="ix_p2">
												<div class="net_status_title">
													<h6 class="f-title"></h6>
													<p id="offline-val"></p>
												</div>
												<i class="boder_rigit"></i>
											</div>
											<div class="status_box text-center" style="text-indent: 1%;">
												<p>
													<span class="sp_describe"></span>
													<span id="cpu_usage_rate">-</span>
												</p>
												<p>
													<span class="sp_describe"></span>
													<span id="memory_usage_rate">-</span>
												</p>
												<i class="boder_rigit"></i>
											</div>
											
										</div>
										<div class="col-xs-12 col-sm-6 col-md-4 col-lg-4">
											<div class="ix_p2">
												<div class="net_status_title">
													<h6 class="f-title"></h6>
													<div class="equipment_online"></div>
													<div class="equipment_online"></div>
													<div class="equipment_online"></div>
												</div>
												
											</div>
											<div class="status_box" style=" padding-top: 10px;">
												<p>
													<span class="sp_describe"></span>
													<span id="hardware_version">-</span>
												</p>
												<p>
													<span class="sp_describe"></span>
													<span id="idx_mac"></span>
												</p>
												<p>
													<span class="sp_describe"></span>
													<span id="version_information"></span>
												</p>
												
											</div>
											<i class="boder_rigit"></i>
										</div>
										<div class="col-xs-12 col-sm-6 col-md-3 col-lg-3 hidden">
											<div class="ix_p2 ">
												<div class="net_status_title">
													<h6 class="f-title" style="padding-top: 40px;margin-bottom:10px"></h6>
													<div class="f-control text-center">
														<input type="checkbox" class="hidden checkboxAll checkboxClick " id="auto_ac_enable" name="auto_ac_enable" value="0" checked="checked">
														<label class="button-label marginTop8 enable_click f-switchTrue">
															<span class="circle"></span>
															<span class="text on">ON</span>
															<span class="text off">OFF</span>
														</label>
													</div>
												</div>
												</div>
											</div>
								</div>	
								</div>
							</div>
						</div>
					</div>
				
			</div>
			
			<div class="container-list">
				<div class="container-fluid">
					<div class="row">
						<div class="col-md-8 col-md-offset-2">
							<div id="module-list-sec" class="clearfix apac"></div>
						</div>
					</div>
				</div>
			</div>
			
				<div class="modal fade" id="ac_ac_para_by_show" data-backdrop="static" tabindex="-1">
				  <div class="modal-dialog">
					<div class="modal-content">
					  <div class="modal-header">
						<button type="button" class="close" data-dismiss="modal" aria-label="Close">
							<!--<span aria-hidden="true">&times;</span>-->
						</button>
						<h4 class="modal-title"></h4>
					  </div>
					  
						<div class="modal-body">
							<p class="single-tip"></p>
						</div>
						  <div class="modal-footer">
							<!--<button type="button" class="dialog-btn btn-cancel" data-dismiss="modal"></button>-->
							<button type="submit" class="dialog-btn btn-confirm"></button>
						  </div>
					  
					</div>
				  </div>
				</div>
				
				
				<div class="modal fade" id="ac_list_modal" data-backdrop="static" tabindex="-1">
				  <div class="modal-dialog">
					<div class="modal-content">
					  <div class="modal-header">
						<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
						<h4 class="modal-title"></h4>
					  </div>
					  <form action="javascript:void(0);" id="ac_list_frm" name="ac_list_frm" method="post" style="padding: 10px;">
						<div class="prompts clearfix marginTop20">
							
							<div class="input-group ap-search-con">
								<input type="text" class="form-control" placeholder="Search for..." id="ac_list_search_input">
								<span class="input-group-btn">
								<button class="btn btn-default" type="button" id="ac_list_search"><i class="icon-search">\e003</i></button>
							  </span>
							</div><!-- /input-group -->
							<div class="title_show">
								
							</div>
						</div> 
						<div class="modal-body table-sec">	
							  <table  class="data-table table table-striped "  id="ac_list_table"></table>
							
				        </div>
						
					  </form>
					</div>
				  </div>
				</div>
			
		</div>
		</div>
	<script type="text/javascript">
		
			loadJsQueue(["index"],true);
		
	</script>
	</body>
</html>
