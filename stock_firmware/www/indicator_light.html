<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title></title>
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=yes, viewport-fit=cover">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
		<meta http-equiv="Expires" content="0">
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
		<meta name="renderer" content="webkit|ie-comp|ie-stand">
		<meta name="format-detection" content="telephone=no"/>
		<link rel="stylesheet" href="css/bootstrap.min.css" />
		<script type="text/javascript" src="js/publicPlugin/app.js"></script>
		<script type="text/javascript">
			document.write("<link rel='stylesheet' type='text/css' href='css/public.css" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.write("<link rel='shortcut icon' type='image/x-icon' href='favicon.ico" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.close();
		</script>
		<script type="text/javascript" src="js/publicPlugin/jquery.min.js"></script>	
		<script type="text/javascript" src="js/publicPlugin/bootstrap.min.js"></script>
		<script type="text/javascript"> 
			document.write('<script src="js/publicPlugin/dLoad.js' + (isApp().isRemote ? "" : '?_=' + new Date().getTime()) + '"><\/script>');
			document.close();
		</script>
		
	</head>
	<body>
		<div class="g-wrapper">
			 <!--头部公用-->   
			<div id="header"></div>
		    <!--内容-->
		    <div class="totalShell_content">
		    	<div class="f-locationH3-container">
		    	</div>
		    	<div class="f-content-container">	 
		    	<div class="container-fluid">
					<div class="row">
						<div class="col-md-8 col-md-offset-2">
							<div class="d-cnt">
							<div class="f-smallShell"><!--中间内容--> 
								<div class="f-smallShell-two">
									
									
									<!--form表单在此-->	
									<div class="infoone">
										<div class="container-fluid">
											<div class="row">
												<div class="form-sec">
												
													<form class="form_indicator_light marginTop50" name="form_indicator_light" method="post" >
														<div class="form-group clearfix">
															<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5 f-label"></label>
															<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
																<input type="checkbox" class="hidden checkboxAll checkboxClick " id="indicator_light_enable"  name="indicator_light_enable" value="1" checked="checked">
																<label class="button-label f-switchTrue marginTop8 enable_click">
																	<span class="circle"></span>
																	<span class="text on">ON</span>
																	<span class="text off">OFF</span>
																</label>
															</div>
														</div>
														
														
											
														
														<div class="form-group clearfix">
															<label class="col-xs-6 col-sm-4 col-md-4 col-lg-5"></label>
															<div class="col-xs-6 col-sm-8 col-md-8 col-lg-7 f-control">
																<button type="button" class="btn btn-save" onClick="submitForm()"></button>
															</div>
														</div>
													</form>
			
												</div>
											</div>
										</div>
									</div>	
									<!--设置结束-->
							
							
									
									</div>
								</div>
								</div>
							</div>
						</div>
					</div>
				</div>
		    </div>
		</div>
		<!--提示弹窗-->
		<div id="lock_div"></div>
		<div id="message_layer">
			<div id="msg_type" class="wait"></div>
			<div id="msg" class="word"></div>
		</div>	
		<script type="text/javascript">
			loadJsQueue(["indicator_light"]);
			
			
		</script>
	</body>
</html>
