<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title></title>
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=yes, viewport-fit=cover">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
		<meta http-equiv="Expires" content="0">
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
		<meta name="renderer" content="webkit|ie-comp|ie-stand">
		<meta name="format-detection" content="telephone=no"/>
		<link rel="stylesheet" href="css/bootstrap.min.css" />
		<script type="text/javascript" src="js/publicPlugin/app.js"></script>
		<script type="text/javascript">
			document.write("<link rel='stylesheet' type='text/css' href='css/public.css" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.write("<link rel='shortcut icon' type='image/x-icon' href='favicon.ico" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.close();
		</script>
		<script type="text/javascript" src="js/publicPlugin/jquery.min.js"></script>	
		<script type="text/javascript" src="js/publicPlugin/bootstrap.min.js"></script>
		<script type="text/javascript"> 
			document.write('<script src="js/publicPlugin/dLoad.js' + (isApp().isRemote ? "" : '?_=' + new Date().getTime()) + '"><\/script>');
			document.close();
		</script>
		<style type="text/css">
		
		.refresh_btn i { width:14px; height:20px; background:url("./images/refresh_icon.png") no-repeat center center; float:left; margin-right:5px; }
		.refresh_btn span { float:left; }
		.refresh_btn:hover span,.refresh_btn:focus span { color:#fff }
		</style>	
	</head>
	<body>
		<div class="g-wrapper">
			 <!--头部公用-->   
			<div id="header"></div>
			
		    <!--内容-->
		    <div class="totalShell_content">
		    	<div class="f-locationH3-container">
		    	</div>
		    	<div class="f-content-container">
		    	<div class="container-fluid adjust">
					<div class="row">
						<div class="col-sm-12 col-md-8 col-md-offset-2">
							<div class="d-cnt">
							<div class="f-smallShell">
								<div class="f-smallShell-two">
									<div class="infoone marginTop40 ">
								<form action="javascript:void(0);"><!--form表单在此-->	
									<!--表格-->
									<div class="table-sec">
										<div class="cnt-header clearfix">
											<h2 class="title"></h2>
											<button class="btn refresh_btn clearfix">
											   <i></i>
											   <span></span>
											</button>
										</div>
										<table  class="table" id="logTab"></table>
										<div class="marginTop20 text-center form-group">
												<!--<button type="button" class="btn btn-refresh" onClick="init_log('refresh');"></button>-->
											<button type="button" class="btn btn-del" id="log_delete_btn"></button>
										</div>
									</div>
								</form>
								</div>
								</div></div></div>
	     				</div>
		    		</div>
				</div>	
		    </div>
		</div>
		</div>	 
	<!--原来的过渡动画弹窗效果-->
    	<div id="lock_div"></div>
		<div id="message_layer">
		    <div id="msg_type" class="wait"></div>
		    <div id="msg" class="word"></div>
		</div>
		<script type="text/javascript">
			loadJsQueue(["dial_up_log"],true);
			
			
		</script>
	</body>
</html>
