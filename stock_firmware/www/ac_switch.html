<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title></title>
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=yes, viewport-fit=cover">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
		<meta http-equiv="Expires" content="0">
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
		<meta name="renderer" content="webkit|ie-comp|ie-stand">
		<meta name="format-detection" content="telephone=no"/>
		<link rel="stylesheet" href="css/bootstrap.min.css" />
		<script type="text/javascript" src="js/publicPlugin/app.js"></script>
		<script type="text/javascript">
			document.write("<link rel='stylesheet' type='text/css' href='css/public.css" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.write("<link rel='shortcut icon' type='image/x-icon' href='favicon.ico" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.close();
		</script>
		<script type="text/javascript" src="js/publicPlugin/jquery.min.js"></script>	
		<script type="text/javascript" src="js/publicPlugin/bootstrap.min.js"></script>
		<script type="text/javascript"> 
			document.write('<script src="js/publicPlugin/dLoad.js' + (isApp().isRemote ? "" : '?_=' + new Date().getTime()) + '"><\/script>');
			document.close();
		</script>
	    <style>
	  		/*#rf-settings-tip-box{width: 60%; margin: 0 auto;}*/
	    	.text_title{display: block;}
	    	
	    </style>
	</head>
	<body>
		<div class="g-wrapper">
			 <!--头部公用-->   
		<div id="header"></div>
			
		    <!--内容-->
		    <div class="totalShell_content">
		    	<div class="f-locationH3-container">
		    	</div>
		    		<div class="f-content-container">   
		    	<div class="container-fluid">
					<div class="row">
						<div class="col-md-8 col-md-offset-2">
							<div class="d-cnt">
							<div class="f-shell"><!--中间内容--> 
								<div class="f-smallShell-two">
									
									
							<!--form表单在此-->	
							<div class="infoone">
								<div class="container-fluid">
									<div class="row">
										<div class="form-sec">
		    						
		    						
								
						
							<div id="rf_settings_list" class="tab-pane">
								<!--表格-->
						        <div class="table-sec marginTop20">
						        	
						           <div class="form-group clearfix hidden">
									<label class="col-xs-6 col-sm-4 col-md-3 col-lg-5 f-label"></label>
									<div class="col-xs-6 col-sm-8 col-md-9 col-lg-7 f-control">
										
										<input type="checkbox" class="hidden checkboxAll checkboxClick" id="ac_enable" name="ac_enable" value="0" checked="checked">
										<label for="toggle-button" class="button-label enable_click marginTop8 ac_enable">
											<span class="circle"></span>
											<span class="text on">ON</span>
											<span class="text off">OFF</span>
										</label>
										<p class="text_title"></p>
									</div>
								</div>
								
								<div class="form-group clearfix" id="autobind_div">
									<label class="col-xs-6 col-sm-4 col-md-3 col-lg-5 f-label"></label>
									<div class="col-xs-6 col-sm-8 col-md-9 col-lg-7 f-control">
										
										<input type="checkbox" class="hidden checkboxAll checkboxClick" id="autobind_enable" name="autobind_enable" value="0" checked="checked">
										<label for="toggle-button" class="button-label marginTop8 enable_click autobind_enable">
											<span class="circle"></span>
											<span class="text on">ON</span>
											<span class="text off">OFF</span>
										</label>
										<p class="text_title"></p>
									</div>
								</div>
						            
						          
						           
						        </div>
					        </div>
					        
					       <!--关闭ac确认-->
		<div class="modal fade" id="close_ac" tabindex="-1">
		  <div class="modal-dialog">
			<div class="modal-content">
			  <div class="modal-header">
				<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
				<h4 class="modal-title"></h4>
			  </div>
			  <div class="modal-body">
			  	<p class="single-tip"></p>
			  </div>
			  <div class="modal-footer">
				<button type="button" class="dialog-btn btn-cancel" data-dismiss="modal"></button>
				<button type="button" class="dialog-btn btn-confirm"></button>
			  </div>
			</div>
		  </div>
		</div>
		
					       <!--开启ac确认-->
		<div class="modal fade" id="enable_ac" tabindex="-1">
		  <div class="modal-dialog">
			<div class="modal-content">
			  <div class="modal-header">
				<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
				<h4 class="modal-title"></h4>
			  </div>
			  <div class="modal-body">
			  	<p class="single-tip"></p>
			  </div>
			  <div class="modal-footer">
				<button type="button" class="dialog-btn btn-cancel" data-dismiss="modal"></button>
				<button type="button" class="dialog-btn btn-confirm"></button>
			  </div>
			</div>
		  </div>
		</div>
		
				       <!--关闭自动绑定确认-->
		<div class="modal fade" id="close_networking" tabindex="-1">
		  <div class="modal-dialog">
			<div class="modal-content">
			  <div class="modal-header">
				<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
				<h4 class="modal-title"></h4>
			  </div>
			  <div class="modal-body">
			  	<p class="single-tip"></p>
			  </div>
			  <div class="modal-footer">
				<button type="button" class="dialog-btn btn-cancel" data-dismiss="modal"></button>
				<button type="button" class="dialog-btn btn-confirm"></button>
			  </div>
			</div>
		  </div>
		</div>
		
	     			</div>
		    	</div>
		    </div>   </div>
		  
		    </div>
		    </div>
		    </div>
		    </div>
		    </div>
		    </div>
		    </div>
		    </div>
		</div>
		

		
    	<script type="text/javascript">
			loadJsQueue(["ac_switch"],true);
		</script>
	</body>
</html>
