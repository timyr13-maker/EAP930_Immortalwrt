<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title></title>
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=yes, viewport-fit=cover">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
		<meta http-equiv="Expires" content="0">
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
		<meta name="renderer" content="webkit|ie-comp|ie-stand">
		<meta name="format-detection" content="telephone=no"/>
		<link rel="stylesheet" href="css/bootstrap.min.css" />
		<script type="text/javascript" src="js/publicPlugin/app.js"></script>
		<script type="text/javascript">
			document.write("<link rel='stylesheet' type='text/css' href='css/public.css" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.write("<link rel='shortcut icon' type='image/x-icon' href='favicon.ico" + (isApp().isRemote ? "" : "?_=" + new Date().getTime()) + "'>");
			document.close();
		</script>
		<script type="text/javascript" src="js/publicPlugin/jquery.min.js"></script>	
		<script type="text/javascript" src="js/publicPlugin/bootstrap.min.js"></script>
		<script type="text/javascript" src="js/publicPlugin/jquery.form.js"></script>
		<script type="text/javascript"> 
			document.write('<script src="js/publicPlugin/dLoad.js' + (isApp().isRemote ? "" : '?_=' + new Date().getTime()) + '"><\/script>');
			document.close();
		</script>
	    <style>
	    	.select_All{vertical-align: middle;}
	    	.noTab { padding-top:50px; }
			#update-tip-box { margin: 20px auto 40px; margin-bottom: 40px; margin-top: 20px;}
			@media (min-width: 650px) {
				#update-tip-box { max-width: 60%; }
			}
			
			@media (max-width: 575px) {
				#update_file_name { border:none; }
				.btn-version-chk,.btn-auto-update { width:100%; }
				#current_version,#cur_version,#new_version { color:#999;}
			}
			#update_form .input-group{ max-width:300px; }
			#update_file_name { width: 100%;}
			#put_file { display:none;}
			.input-group-btn .file-btn {height:36px;width:auto;min-width:inherit;color:#535353;padding:6px 15px;font-size:14px;background:#f5f5f5;border:1px solid #ccc;}
			
			.btn-auto-update {
				margin-left:15px;
			}
			
			.btn-auto-update.off {
				display:none !important;
			}
			
			@media (max-width: 1100px) {
				.btn-auto-update {
					margin-left:0;
					margin-top:20px;
					display:block;
				}
			}
			.upgrading_list_h3{font-size: 18px;font-weight: 300;}
	    </style>
	</head>
	<body>
		<div class="g-wrapper">
			 <!--头部公用-->   
		<div id="header"></div>
			
		    <!--内容-->
		    <div class="totalShell_content">
		    	<div class="f-locationH3-container">
		    	</div>
		    		<div class="f-content-container">   
		    	<div class="container-fluid">
					<div class="row">
						<div class="col-md-8 col-md-offset-2">
							<div class="d-cnt">
							<div class="f-shell"><!--中间内容--> 
								<div class="f-smallShell-two">
									
									
							<!--form表单在此-->	
							<div class="infoone">
								<div class="container-fluid">
									<div class="row">
										<div class="form-sec">
		    			
								
						
							<div id="upgradation_list" class="tab-pane">
								<!--表格-->
						        <div class="table-sec marginTop20">
						        	
						            <table  class="data-table table table-striped "  id="upgradation_table"></table>
						            
						            <div class="form-group" style="width: 90%;margin: 20px auto 0 auto;">
						            	<!--<input type="checkbox" name="checkboxShall" id="select_All" style="margin-left: 20px;" value="0" class="checkboxShall">
						            	<span class="select_All"></span>-->
						            </div>
						            <div  class="form-group text-center marginTop20">
						            	<button type="button" class="btn  btn-upgradation"></button>
						            	<button type="button" class="btn  btn-reset"></button>
						            </div>
						        </div>
						        
						         
					        </div>
					        
					        <div id="upgrading_list" class="tab-pane hidden">       	
					        	<div class="table-sec marginTop20">
					        		<h3 class="upgrading_list_h3 text-center"></h3>
						         	<table  class="data-table table table-striped" style="margin-top: 20px;"  id="upgrading_table"></table>
						         </div>
						         <div class="form-group text-center marginTop20" style="width: 90%;margin: 50px auto 0 auto;">
						            
							            <button   type="button" class="btn  btn-cancel hidden"></button>
							    </div>
					        </div>
					        
					        <div id="upgradation_details" class="modal fade" tabindex="-1">
												<div class="modal-dialog">
													<div class="modal-content">
													  <div class="modal-header">
														<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
														<h4 class="modal-title"></h4>
													  </div>
													  <form action="javascript:void(0);" id="update_form" name="update_form" method="post">
														  <div class="modal-body">	
															
															
															<div class="form-group clearfix">
																<div class="col-xs-6  col-sm-offset-0 col-sm-4 col-md-4 col-lg-3 f-label-w">
																	<label class="f-label" for="channel_2_4"></label>
																</div>
																<div class="col-xs-6  col-sm-offset-0 col-sm-8 col-md-8 col-lg-9 f-control ">
																	<div class="input-group">
																		<input type="text" class="form-control" id="update_file_name" readonly >
																		<span class="input-group-btn">
																			<label class="btn file-btn" for="put_file">
																				<input id="put_file" name="file1" type="file" style="display:none;" onChange="put_fileFn()">
																				<span class="view"></span>
																			</label>
																			
																		</span>
																	</div>
																</div>
															</div>
															
															
														  </div>
														  <div class="modal-footer">
															<button type="button" class="dialog-btn btn-cancel" data-dismiss="modal"></button>
															<button type="button" class="dialog-btn btn-confirm"></button>
														  </div>
													  </form>
													</div>
												  </div>
								
					        </div>
					        
					        <div class="modal fade" id="resetModal" tabindex="-1">
							  <div class="modal-dialog">
								<div class="modal-content">
								  <div class="modal-header">
									<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
									<h4 class="modal-title"></h4>
								  </div>
								  <div class="modal-body">
								  </div>
								  <div class="modal-footer">
									<button type="button" class="dialog-btn btn-cancel" data-dismiss="modal"></button>
									<button type="button" class="dialog-btn btn-confirm"></button>
								  </div>
								</div>
							  </div>
							</div>
	     			</div>
		    	</div>
		    </div>   </div>
		  
		    </div>
		    </div>
		    </div>
		    </div>
		    </div>
		    </div>
		    </div>
		    </div>
		</div>
	

		
    	<script type="text/javascript">
			loadJsQueue(["apac_upgradation"],true);
		</script>
	</body>
</html>
